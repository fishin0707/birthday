<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday & Merry Christmas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap');

        :root {
            --bg-night: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            --bg-birthday: linear-gradient(to bottom, #501010, #881212);
            --text-color: #fff;
            --gold: #ffd700;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            background: var(--bg-night);
            transition: background 2s ease-in-out;
            color: var(--text-color);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1s;
        }

        .intro-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            border-radius: 5px;
        }

        .intro-btn:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 20px var(--gold);
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 100%;
            cursor: pointer;
        }

        .sleigh-container {
            position: absolute;
            top: 15%;
            right: -20%;
            z-index: 5;
            font-size: 3rem;
            opacity: 0.8;
            filter: brightness(0);
            animation: flyAcross 25s linear infinite;
            pointer-events: none;
        }

        @keyframes flyAcross {
            0% { transform: translateX(0) translateY(0) rotate(5deg); right: -20%; }
            100% { transform: translateX(-150vw) translateY(-50px) rotate(-5deg); right: 120%; }
        }

        .star {
            font-size: 80px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: pulse 2s infinite ease-in-out;
            transition: opacity 1s, transform 1s;
            display: inline-block;
        }

        .cake {
            font-size: 100px;
            display: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s;
            filter: drop-shadow(0 0 15px rgba(255, 200, 100, 0.6));
        }

        .message {
            margin-top: 20px;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            transition: opacity 1s;
        }
        
        .sub-message {
            font-size: 1rem;
            margin-top: 10px;
            color: #ddd;
            opacity: 0.8;
            transition: opacity 1s;
        }

        .photo-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 15;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease-out;
            pointer-events: none;
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        body.celebrate {
            background: var(--bg-birthday);
        }

        .hint {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.6;
            animation: fadeInOut 3s infinite;
        }
        
        @keyframes fadeInOut { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        audio { display: none; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h1 style="color:white; margin-bottom:30px; font-weight:normal;">A Special Gift</h1>
        <button class="intro-btn" onclick="startExperience()">開啟卡片 Open</button>
    </div>

    <canvas id="canvas"></canvas>

    <div class="sleigh-container" id="sleigh">🦌🦌🎅🛷</div>

    <div class="container" id="interaction-area">
        <div id="star" class="star">✦</div>
        <div id="cake" class="cake">🎂</div>

        <div id="text-container">
            <div class="message" id="main-text">Silent Night, Holy Night...</div>
            <div class="sub-message" id="sub-text">平安夜的星光</div>
        </div>
    </div>

    <div class="hint" id="hint-text">( 點擊星光 / Tap the Star )</div>

    <div class="photo-container" id="teacher-photo">
        <div class="photo-frame">
            <img src="teacher.png" alt="Teacher's Photo" id="real-photo">
        </div>
    </div>

    <audio id="music-xmas" loop>
        <source src="xmas.mp3" type="audio/mpeg">
    </audio>
    <audio id="music-bday" loop>
        <source src="birthday.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const star = document.getElementById('star');
        const cake = document.getElementById('cake');
        const mainText = document.getElementById('main-text');
        const subText = document.getElementById('sub-text');
        const hintText = document.getElementById('hint-text');
        const container = document.getElementById('interaction-area');
        const sleigh = document.getElementById('sleigh');
        const photoContainer = document.getElementById('teacher-photo');
        
        const musicXmas = document.getElementById('music-xmas');
        const musicBday = document.getElementById('music-bday');
        musicXmas.volume = 0.5;
        musicBday.volume = 0.6;

        let width, height;
        let particles = [];
        let isBirthday = false;

        function startExperience() {
            const overlay = document.getElementById('intro-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 1000);
            
            musicXmas.play().catch(e => console.log("Audio play failed:", e));
            
            initCanvas();
            animate();
        }

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 1 + 0.5;
                this.angle = Math.random() * 360;
                this.spin = Math.random() < 0.5 ? 1 : -1;
                
                if (isBirthday) {
                    this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
                    this.type = 'confetti';
                    this.speed = Math.random() * 3 + 2;
                    this.size = Math.random() * 6 + 4;
                } else {
                    this.color = 'rgba(255, 255, 255, 0.8)';
                    this.type = 'snow';
                }
            }
            update() {
                this.y += this.speed;
                this.angle += this.spin;
                if (this.type === 'confetti') {
                    this.x += Math.sin(this.angle * 0.05) * 2;
                } else {
                    this.x += Math.sin(this.angle * 0.02) * 0.5;
                }
                if (this.y > height) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'confetti') {
                    ctx.fillRect(this.x, this.y, this.size, this.size/2);
                } else {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                }
                ctx.fill();
            }
        }

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 150; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        function celebrate() {
            if (isBirthday) return;
            isBirthday = true;

            document.body.classList.add('celebrate');
            hintText.style.display = 'none';
            sleigh.style.display = 'none';

            fadeOut(musicXmas);
            setTimeout(() => { musicBday.play().catch(e => console.log(e)); }, 500);

            star.style.opacity = '0';
            star.style.transform = 'scale(0) rotate(180deg)';
            mainText.style.opacity = '0';
            subText.style.opacity = '0';

            setTimeout(() => {
                star.style.display = 'none';
                cake.style.display = 'block';
                setTimeout(() => {
                    cake.style.opacity = '1';
                    cake.style.transform = 'scale(1)';
                }, 50);

                mainText.innerText = "Tonight, a star was born.";
                subText.innerText = "老師，生日快樂！";
                mainText.style.opacity = '1';
                subText.style.opacity = '1';
                
                photoContainer.classList.add('photo-show');
                particles.forEach(p => p.reset());
            }, 800);
        }

        function fadeOut(audio) {
            let fade = setInterval(() => {
                if (audio.volume > 0.1) {
                    audio.volume -= 0.1;
                } else {
                    clearInterval(fade);
                    audio.pause();
                }
            }, 100);
        }

        window.addEventListener('resize', initCanvas);
        container.addEventListener('click', celebrate);
    </script>
</body>
</html>
